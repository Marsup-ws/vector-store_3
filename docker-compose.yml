version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: app_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_commerciale}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-app_commerciale}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-nestJS
      dockerfile: Dockerfile
    container_name: app_backend_nestjs
    restart: always
    environment:
      PORT: 4000
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_commerciale}
    ports:
      - '4000:4000'
    depends_on:
      postgres_db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-nextJS
      dockerfile: Dockerfile
    container_name: app_frontend_nextjs
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
